<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <style>
      .text-arc { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 500; font-size: 19px; fill: #f0ede6; letter-spacing: 4.5px; }
      .stem { stroke: #f0ede6; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .leaf { stroke: #f0ede6; stroke-width: 1.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .dot { fill: #f0ede6; }
    </style>
  </defs>

  <!-- Background circle (transparent by default) -->
  <circle cx="200" cy="200" r="195" fill="none"/>

  <!-- Top arc text: VERDANT CURATION -->
  <path id="top-arc" d="M 72,200 A 128,128 0 0,1 328,200" fill="none"/>
  <text font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500" font-size="19" fill="currentColor" letter-spacing="4.5">
    <textPath href="#top-arc" startOffset="50%" text-anchor="middle">VERDANT CURATION</textPath>
  </text>

  <!-- Bottom arc text: CURATED SPACES, NATURALLY. -->
  <path id="bottom-arc" d="M 328,200 A 128,128 0 0,1 72,200" fill="none"/>
  <text font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="500" font-size="14" fill="currentColor" letter-spacing="3.5">
    <textPath href="#bottom-arc" startOffset="50%" text-anchor="middle">CURATED SPACES, NATURALLY.</textPath>
  </text>

  <!-- Left dot separator -->
  <circle cx="72" cy="200" r="2.5" fill="currentColor"/>

  <!-- Right dot separator -->
  <circle cx="328" cy="200" r="2.5" fill="currentColor"/>

  <!-- Center illustration: delicate plant stem with leaves -->
  <!-- Main stem -->
  <path class="stem" d="M 200,252 Q 198,230 200,210 Q 202,190 200,170 Q 198,155 200,140"/>

  <!-- Right leaf 1 (lower) -->
  <path class="leaf" d="M 200,230 Q 218,218 230,225 Q 234,228 228,236 Q 218,240 200,235"/>

  <!-- Left leaf 1 (lower) -->
  <path class="leaf" d="M 200,215 Q 182,205 170,210 Q 166,213 172,220 Q 182,224 200,218"/>

  <!-- Right leaf 2 (middle) -->
  <path class="leaf" d="M 200,198 Q 222,184 235,192 Q 238,196 232,204 Q 220,208 200,202"/>

  <!-- Left leaf 2 (middle) -->
  <path class="leaf" d="M 200,183 Q 178,170 165,178 Q 162,182 168,188 Q 178,192 200,186"/>

  <!-- Right leaf 3 (upper, smaller) -->
  <path class="leaf" d="M 200,166 Q 216,156 225,162 Q 228,165 222,170 Q 214,174 200,169"/>

  <!-- Left leaf 3 (upper, smaller) -->
  <path class="leaf" d="M 200,154 Q 184,145 176,150 Q 173,153 178,158 Q 186,161 200,156"/>

  <!-- Top bud -->
  <path class="leaf" d="M 200,140 Q 208,130 200,125 Q 192,130 200,140"/>
</svg>
